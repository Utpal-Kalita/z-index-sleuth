<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive reproduction fixture</title><link id="fixture-css" rel="stylesheet" href="/evidence/original.css"><style>body{min-height:280px;height:100vh;padding:22px;box-sizing:border-box}.container{max-width:500px}h1{font-size:24px}p{font-size:14px;line-height:1.6}#viewer-note{position:fixed;bottom:12px;left:12px;color:#999;font:11px ui-monospace,monospace;z-index:10000}.outline-on .loading-overlay{outline:3px dashed #ee8b77;outline-offset:-5px;background:rgba(238,139,119,.12);opacity:1}.loading-overlay[aria-hidden=false]{opacity:.65}.spinner{animation:none}</style></head>
<body><div class="container"><h1>Dashboard Home</h1><p>Click below to generate your compliance and performance report.</p><button id="generate-btn">Generate Report</button><div id="report-status" role="status"></div></div><div class="loading-overlay" aria-hidden="true"><div class="spinner"></div></div><span id="viewer-note">INTERACTIVE REPRODUCTION · ORIGINAL CSS</span><script>
const repaired=new URLSearchParams(location.search).get('mode')==='repaired';document.querySelector('#fixture-css').href=repaired?'/evidence/repaired.css':'/evidence/original.css';document.querySelector('#viewer-note').textContent='INTERACTIVE REPRODUCTION · '+(repaired?'REPAIRED CSS':'ORIGINAL CSS');document.querySelector('#generate-btn').addEventListener('click',()=>{const s=document.querySelector('#report-status');s.textContent='Report generated successfully.';s.style.color='#a8c8a2'});window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data?.type==='TOGGLE_OUTLINES')document.body.classList.toggle('outline-on',!!e.data.enabled)});
</script></body></html>
